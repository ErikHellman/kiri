name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warnings in Kiri's own code fail the build (App/project.yml,
  # KiriKit/Package.swift). Dependencies' warnings don't.
  KIRI_WARNINGS_AS_ERRORS: "YES"

jobs:
  # SwiftLint's rules (.swiftlint.yml), every one an error. Keep the
  # version here and the one you lint with locally (brew) the same.
  lint:
    name: lint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: swiftlint
        run: swiftlint lint --strict --reporter github-actions-logging

  # The token layer is plain Foundation, so its tests also run on Linux.
  linux:
    name: linux
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packages at the commits KiriKit/Package.resolved names, and no others.
      - name: test KiriKit
        working-directory: KiriKit
        run: swift test --only-use-versions-from-resolved-file
      # What a release's tag must be (.github/workflows/release.yml).
      - name: test the release tag check
        run: scripts/tests/check-release-tag-test.sh

  macos:
    name: macos
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: test KiriKit
        working-directory: KiriKit
        run: swift test --only-use-versions-from-resolved-file
      - name: build app
        working-directory: App
        run: |
          brew install xcodegen
          xcodegen
          # The packages at the commits the lockfile names, App/Package.resolved,
          # and a failed build if it would need any other (scripts/packages.sh).
          ../scripts/packages.sh lock
          xcodebuild build -project Kiri.xcodeproj -scheme Kiri \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO KIRI_WARNINGS_AS_ERRORS=YES -quiet
          ../scripts/packages.sh check
          # Fail if nothing was built (an empty scheme also "succeeds").
          test -x build/Build/Products/Debug/Kiri.app/Contents/MacOS/Kiri
          # Sparkle is embedded, for updates.
          test -d build/Build/Products/Debug/Kiri.app/Contents/Frameworks/Sparkle.framework
          # The video player is embedded, and not linked (AVKit isn't loaded at launch).
          test -d build/Build/Products/Debug/Kiri.app/Contents/Frameworks/KiriVideo.framework
          for binary in build/Build/Products/Debug/Kiri.app/Contents/MacOS/*; do
            if otool -L "$binary" | grep -qE "KiriVideo.framework|/AVKit.framework/"; then
              echo "$binary links the video player or AVKit, which must load only when a video opens" >&2
              exit 1
            fi
          done
          # The kiri command ships executable in the bundle.
          test -x build/Build/Products/Debug/Kiri.app/Contents/Resources/kiri
          build/Build/Products/Debug/Kiri.app/Contents/Resources/kiri --help >/dev/null
          build/Build/Products/Debug/Kiri.app/Contents/Resources/kiri --version
