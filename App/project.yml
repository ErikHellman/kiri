# XcodeGen spec for Kiri. Generate the project with
#   brew install xcodegen && cd App && xcodegen
# Kiri.xcodeproj is generated and not checked in.
name: Kiri
options:
  bundleIdPrefix: se.hellsoft
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The release workflow sets both from the tag (v0.2.0 -> 0.2.0) and the
    # number of commits, so CURRENT_PROJECT_VERSION, which Sparkle compares,
    # only ever grows. These are what a local build gets.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set to your Apple developer team id locally to sign.
    DEVELOPMENT_TEAM: ""
packages:
  # The Honey + Liquid Glass style kit (and, later, the editor core).
  KiriKit:
    path: ../KiriKit
  # Updates (App/Kiri/Updater.swift, docs/RELEASING.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  # Anonymous crash reports, analytics and feedback (App/Kiri/Telemetry.swift).
  Vaka:
    url: https://github.com/ErikHellman/vaka
    exactVersion: 0.5.0
targets:
  Kiri:
    type: application
    platform: macOS
    sources:
      - Kiri
      # The `kiri` command (Contents/Resources/kiri).
      - path: CLI/kiri
        buildPhase: resources
      # What's new (WhatsNew.swift): each version's notes, the files the
      # release workflow publishes too, as Contents/Resources/release-notes.
      - path: ../docs/release-notes
        type: folder
        buildPhase: resources
    info:
      path: Kiri/Info.plist
      properties:
        CFBundleDocumentTypes:
          # NSDocumentClass is KiriDocument's Objective-C name (`@objc(KiriDocument)`).
          - CFBundleTypeName: Text Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            NSDocumentClass: KiriDocument
            LSItemContentTypes:
              - public.plain-text
              - public.text
              - public.source-code
              - net.daringfireball.markdown
              - public.json
              - public.yaml
              - public.xml
              - public.comma-separated-values-text
              - public.shell-script
              - public.python-script
              - public.swift-source
              - com.netscape.javascript-source
              - public.html
          - CFBundleTypeName: Any File
            CFBundleTypeRole: Editor
            LSHandlerRank: None
            NSDocumentClass: KiriDocument
            LSItemContentTypes:
              - public.data
        # `kiri` command-line requests (App/CLI/kiri, KiriCLI.swift).
        CFBundleURLTypes:
          - CFBundleURLName: se.hellsoft.kiri.cli
            CFBundleURLSchemes: [kiri]
        # Sparkle: where new versions are announced (the release workflow
        # publishes it) and the EdDSA key their signatures are checked with.
        # With either empty, Kiri doesn't update itself (see Updater.swift).
        SUFeedURL: $(KIRI_FEED_URL)
        SUPublicEDKey: $(KIRI_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.hellsoft.kiri
        # The appcast on this repo's newest release (docs/RELEASING.md).
        KIRI_FEED_URL: https://github.com/ErikHellman/kiri/releases/latest/download/appcast.xml
        # The public half of the update signing key, as Sparkle's
        # generate_keys prints it (docs/RELEASING.md). Public, so it lives here.
        KIRI_SPARKLE_PUBLIC_KEY: "B++wAVUb3kXZuhu8zgZ3TH+kUlfdEgtysqLbXkoWoWA="
        PRODUCT_NAME: Kiri
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kiri
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    postBuildScripts:
      - name: Make the kiri command executable
        # Runs only when the copied script changes (the stamp is its output).
        script: |
          chmod 755 "$SCRIPT_INPUT_FILE_0"
          touch "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/kiri
        outputFiles:
          - $(DERIVED_FILE_DIR)/kiri-executable.stamp
    dependencies:
      - package: KiriKit
        product: KiriKit
      - package: KiriKit
        product: KiriSyntax
      # The Markdown preview's page (App/Kiri/MarkdownPreview.swift).
      - package: KiriKit
        product: KiriMarkdown
      - package: Sparkle
      - package: Vaka
