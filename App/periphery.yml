# XcodeGen spec for Periphery's scan (scripts/periphery.sh): Kiri's own
# project (project.yml) as KiriPeriphery.xcodeproj, with one scheme that
# builds the app and the video player and KiriKit's tests, so code only
# the tests use isn't reported as unused. Generated by the script, not
# checked in, and not the project to build Kiri with.
include: [project.yml]
name: KiriPeriphery
schemes:
  Periphery:
    build:
      targets:
        Kiri: all
        KiriVideo: all
    test:
      targets:
        - package: KiriKit/KiriKitTests
        - package: KiriKit/KiriMarkdownTests
        - package: KiriKit/KiriSyntaxTests
