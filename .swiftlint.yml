# SwiftLint (https://github.com/realm/SwiftLint): a small set of rules that
# catch crashes, leftovers and mistakes, not style. CI runs
#   swiftlint lint --strict
# from the repository root (the `lint` job in .github/workflows/ci.yml, at
# the version pinned there), so every rule below fails the build. Run the
# same locally (brew install swiftlint). A justified exception is a
# `// swiftlint:disable:next <rule>` with the reason after it.
included:
  - App/Kiri
  - App/KiriVideo
  - KiriKit/Sources
  - KiriKit/Tests
excluded:
  - App/build
  - App/Kiri.xcodeproj
  - KiriKit/.build
  - build
  # Highlight queries copied from the grammars.
  - KiriKit/Sources/KiriSyntax/Queries

only_rules:
  # Crashes.
  - force_cast
  - force_try
  - force_unwrapping
  - fatal_error_message
  # Leftovers.
  - unused_closure_parameter
  - unused_optional_binding
  - unused_enumerated
  - unused_setter_value
  - redundant_discardable_let
  # Clearer, and no slower.
  - empty_string
  - is_disjoint
  - contains_over_first_not_nil
  - first_where
  - last_where
  - toggle_bool
  - redundant_nil_coalescing
  # Mistakes.
  - weak_delegate
  - class_delegate_protocol
  - duplicate_imports
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - identical_operands
  - overridden_super_call
  - notification_center_detachment
  - self_in_property_initialization
  - unowned_variable_capture
  # Size, generous: today's longest functions are self-tests.
  - cyclomatic_complexity
  - function_body_length
  # The disable comments themselves.
  - superfluous_disable_command
  - invalid_swiftlint_command

cyclomatic_complexity:
  warning: 35
  error: 35
  ignores_case_statements: true
function_body_length:
  warning: 250
  error: 250
